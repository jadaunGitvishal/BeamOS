android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Ref 26 (targetSdk arm): AGP 8.2.0 only "officially" validates compileSdk <= 34.
# compileSdk 36 builds cleanly with it (no dependency needs a newer AAPT2/AGP);
# this silences the otherwise-noisy per-build "not tested" warning. Revisit if
# AGP is upgraded.
android.suppressUnsupportedCompileSdk=36
