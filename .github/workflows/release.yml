name: Release

# Fires when a version tag is pushed (e.g. v1.8.0). Builds + publishes artifacts
# only - nothing here deploys to production.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  # Fail-fast: a hand-pushed tag that disagrees with VERSION must not publish
  # anything (the artifacts would report the wrong version). Gates everything.
  verify:
    name: Verify tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert pushed tag equals VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          echo "pushed tag: ${GITHUB_REF_NAME} (stripped: $TAG)   VERSION file: $FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ($FILE) - refusing to publish."
            exit 1
          fi
          echo "OK: tag matches VERSION ($FILE)"

  # Same MySQL service, restricted test account and runner setup as
  # server-tests.yml. Gated on a known-failure baseline until the pre-existing
  # SQLite-era/stale test failures are fixed: the job fails if the runner
  # refuses, the summary is missing/malformed, anything is cancelled, or the
  # failure count rises above KNOWN_FAILURES. Throwaway passwords, ephemeral
  # service container only.
  test:
    name: Tests
    needs: verify
    runs-on: ubuntu-latest
    env:
      KNOWN_FAILURES: "54"   # temporary baseline; lower it as failures are fixed
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: beamos
          MYSQL_USER: beamos_user
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Create restricted test user
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot <<'SQL'
          CREATE USER 'beamos_test_user'@'%' IDENTIFIED BY 'ci_test_only_password';
          GRANT ALL PRIVILEGES ON `beamos\_test%`.* TO 'beamos_test_user'@'%';
          FLUSH PRIVILEGES;
          SHOW GRANTS FOR 'beamos_test_user'@'%';
          SQL

      - name: Install deps
        working-directory: server
        run: npm ci

      # Always succeeds: records npm's real exit code for the check below
      # (set +e so bash -eo pipefail can't end the step before PIPESTATUS is read).
      - name: npm test
        id: npmtest
        working-directory: server
        shell: bash
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "beamos_user"
          MYSQL_PASSWORD: "ci_test_password"
          MYSQL_DATABASE: "beamos"
          MYSQL_TEST_USER: "beamos_test_user"
          MYSQL_TEST_PASSWORD: "ci_test_only_password"
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          NPM_EXIT=${PIPESTATUS[0]}
          set -e
          echo "npm test exit code: $NPM_EXIT"
          echo "exit_code=$NPM_EXIT" >> "$GITHUB_OUTPUT"

      - name: Check test summary against the known-failure baseline
        shell: bash
        env:
          NPM_EXIT: ${{ steps.npmtest.outputs.exit_code }}
          LOG: ${{ runner.temp }}/npm-test.log
        run: |
          # Every rejection below is an explicit check; don't let -e/pipefail end the
          # script silently (e.g. grep -c finding 0 matches) without an ::error::.
          set +e -u
          reject() { echo "::error::$1"; exit 1; }

          echo "npm test exit code: ${NPM_EXIT:-<missing>}"
          case "${NPM_EXIT:-}" in
            0|1) ;;
            *) reject "npm test exit code is '${NPM_EXIT:-<missing>}' - only 0 or 1 is a test result (130/137/143 = killed by a signal)" ;;
          esac
          case "$KNOWN_FAILURES" in
            ''|*[!0-9]*) reject "KNOWN_FAILURES '$KNOWN_FAILURES' is not a non-negative integer" ;;
          esac
          [ -s "$LOG" ] || reject "test log $LOG is missing or empty"

          # The runner must have reset the test DB and started the tests.
          grep -Eq '^\[run-tests\] .+ reset as .+' "$LOG" \
            || reject "no '[run-tests] ... reset as ...' line - the test runner refused or setup failed"
          FILES=$(sed -nE 's/^\[run-tests\] running ([0-9]+) test file\(s\)$/\1/p' "$LOG" | tail -n 1)
          [ -n "$FILES" ] && [ "$FILES" -gt 0 ] \
            || reject "no '[run-tests] running <N> test file(s)' line with N > 0 - the test runner refused or setup failed"

          # Exactly one top-level TAP plan line, immediately followed by the summary block.
          PLAN_COUNT=$(grep -cE '^1\.\.[0-9]+$' "$LOG")
          [ "$PLAN_COUNT" -eq 1 ] || reject "expected exactly one top-level TAP plan line '1..<n>', found $PLAN_COUNT"
          PLAN_LINE=$(grep -nE '^1\.\.[0-9]+$' "$LOG" | cut -d: -f1)

          # Read the block that follows the plan: '# key value' lines in node's order.
          KEYS=""
          declare -A VAL=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^#\ (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)\ (.*)$ ]]; then
              KEYS="$KEYS ${BASH_REMATCH[1]}"
              VAL[${BASH_REMATCH[1]}]="${BASH_REMATCH[2]}"
            else
              break
            fi
          done < <(tail -n +"$((PLAN_LINE + 1))" "$LOG")
          ORDER=$(echo "$KEYS" | tr ' ' '\n' | grep -E '^(tests|pass|fail|cancelled|skipped|todo)$' | tr '\n' ' ')
          [ "$ORDER" = "tests pass fail cancelled skipped todo " ] \
            || reject "malformed summary: expected '# tests/pass/fail/cancelled/skipped/todo' right after the TAP plan, got [${KEYS# }]"
          for k in tests pass fail cancelled skipped todo; do
            [[ "${VAL[$k]}" =~ ^[0-9]+$ ]] || reject "malformed summary: '# $k ${VAL[$k]}' is not a non-negative integer"
            N=$(grep -cE "^# $k [0-9]+$" "$LOG")
            [ "$N" -eq 1 ] || reject "malformed summary: '# $k' appears $N times (expected one final summary block)"
          done
          # Nothing TAP-shaped may follow the block (it must be the final one).
          if tail -n +"$((PLAN_LINE + 1))" "$LOG" | grep -Eq '^(not )?ok [0-9]+ |^# Subtest: |^1\.\.[0-9]+$|^TAP version'; then
            reject "malformed summary: TAP output continues after the final summary block"
          fi

          T=${VAL[tests]} P=${VAL[pass]} F=${VAL[fail]} C=${VAL[cancelled]} S=${VAL[skipped]} D=${VAL[todo]}
          echo "summary: tests=$T pass=$P fail=$F cancelled=$C skipped=$S todo=$D (files=$FILES, baseline=$KNOWN_FAILURES)"
          [ "$T" -eq $((P + F + C + S + D)) ] \
            || reject "malformed summary: tests ($T) != pass + fail + cancelled + skipped + todo ($((P + F + C + S + D)))"
          [ "$C" -eq 0 ] || reject "$C test(s) cancelled (timeout or a crashed test file)"
          if [ "$NPM_EXIT" -eq 0 ] && [ "$F" -ne 0 ]; then
            reject "npm test exited 0 but the summary reports $F failure(s)"
          fi
          if [ "$NPM_EXIT" -eq 1 ] && [ "$F" -lt 1 ]; then
            reject "npm test exited 1 but the summary reports 0 failures (crash after the summary?)"
          fi

          if [ "$F" -gt 0 ]; then
            echo "::group::Failing tests ($F)"
            grep -E '^ *not ok [0-9]+ - ' "$LOG" | sed -E 's/^ *not ok [0-9]+ - //'
            echo "::endgroup::"
          fi
          [ "$F" -le "$KNOWN_FAILURES" ] \
            || reject "$F test failure(s) exceed the known-failure baseline of $KNOWN_FAILURES (npm exit code $NPM_EXIT)"
          echo "::warning::$F known test failure(s) accepted (baseline $KNOWN_FAILURES, npm test exit code $NPM_EXIT)"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-log
          path: ${{ runner.temp }}/npm-test.log

  artifacts:
    name: Tarball + Tizen .wgt + GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history, for release notes

      - name: Resolve version + previous tag
        id: ver
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          # #80: a version carrying a -suffix (e.g. 1.9.0-rc1) is a pre-release.
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Releasing ${GITHUB_REF_NAME} (version $VERSION, prerelease=$PRE); previous tag: ${PREV:-<none>}"

      - name: Build Tizen .wgt (unsigned in CI)
        run: |
          chmod +x tizen/build-wgt.sh
          ( cd tizen && ./build-wgt.sh )   # no Tizen CLI on the runner => unsigned zip
          cp tizen/ScreenTinker.wgt ScreenTinker.wgt
          ls -la ScreenTinker.wgt

      - name: Build source tarball (bundles the .wgt; the signed apk is added by scripts/finalize-release.sh)
        run: |
          OUT="screentinker-${{ steps.ver.outputs.version }}.tar.gz"
          tar czf "$OUT" \
            --exclude='node_modules' --exclude='.git' --exclude='.github' \
            --exclude='*.db' --exclude='*.db-wal' --exclude='*.db-shm' --exclude='*.db.*' \
            --exclude='server/uploads' --exclude='server/certs' --exclude='server/test' \
            --exclude='*.apk' \
            server frontend scripts docs VERSION README.md LICENSE .env.example ScreenTinker.wgt
          echo "TARBALL=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Generate release notes
        run: |
          PREV="${{ steps.ver.outputs.prev }}"
          {
            echo "## ScreenTinker ${{ steps.ver.outputs.tag }}"
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${{ steps.ver.outputs.tag }}"
            else
              echo "_First tagged release. Most recent changes:_"
              git log --no-merges --pretty='- %s' -n 30 "${{ steps.ver.outputs.tag }}"
            fi
            echo
            echo "### Artifacts"
            echo "- \`${TARBALL}\` - bundle: server + frontend source + the Tizen .wgt (the signed Android APK is added at the root during release finalization)."
            echo "- \`ScreenTinker.wgt\` - Tizen TV web app, **unsigned - for inspection only**."
            echo "  Sign it with your own Samsung certificate (Tizen Studio + a profile that includes"
            echo "  your TV's DUID) to install, or - easiest - point a Tizen TV browser / URL Launcher"
            echo "  at \`https://<your-instance>/player\` (no signing needed)."
            if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
              echo "- Docker image: \`ghcr.io/screentinker/screentinker:${{ steps.ver.outputs.version }}\` (pre-release - \`:latest\` is NOT moved)."
            else
              echo "- Docker image: \`ghcr.io/screentinker/screentinker:${{ steps.ver.outputs.version }}\` (also \`:latest\`)."
            fi
            echo "- \`ScreenTinker.apk\` - signed Android player (attached during release finalization)."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # #80: pre-release tags publish as a GitHub *pre-release* (not "Latest"),
          # which also keeps the /releases/latest API pointing at the last stable.
          PRERELEASE_FLAG=""
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"
          gh release create "${{ steps.ver.outputs.tag }}" \
            $PRERELEASE_FLAG \
            --title "ScreenTinker ${{ steps.ver.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            "${TARBALL}" \
            tizen/ScreenTinker.wgt

  docker:
    name: Docker image (amd64 + arm64) -> ghcr
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: ver
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # #80: move :latest only for final releases - a pre-release (1.9.0-rc1) must
          # not repoint :latest onto untested code (anyone on :latest pulls it on restart).
          TAGS="ghcr.io/screentinker/screentinker:$VERSION"
          case "$VERSION" in
            *-*) echo "Pre-release $VERSION: :latest will NOT be moved" ;;
            *)   TAGS="${TAGS}"$'\n'"ghcr.io/screentinker/screentinker:latest" ;;
          esac
          { echo "tags<<__EOF__"; printf '%s\n' "$TAGS"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}

  # TODO (deferred): build + sign the Android APK in CI. Requires the release
  # keystore + passwords as encrypted Actions secrets. For now the maintainer
  # attaches a signed APK out-of-band (and self-hosters mount one at
  # /data/ScreenTinker.apk).
